apiVersion: apps/v1
kind: Deployment
metadata:
  name: tigergate-test-rust
spec:
  replicas: 1
  selector:
    matchLabels: { app: tigergate-test-rust }
  template:
    metadata:
      labels: { app: tigergate-test-rust }
    spec:
      hostNetwork: true # Deliberately insecure IaC fixture.
      containers:
        - name: app
          image: tigergate-test-rust:latest
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: DATABASE_PASSWORD
              value: "fixture-password-not-real"
