# DELIBERATELY INSECURE CloudFormation — IaC scanner fixture. Do not deploy.
AWSTemplateFormatVersion: "2010-09-09"
Description: tigergate insecure fixture stack

Parameters:
  DbPassword:
    Type: String
    Default: YD1BE4nRNpELLvMz9Arn   # secret as a parameter default, NoEcho missing

Resources:
  PublicBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: tigergate-cfn-public-fixture
      AccessControl: PublicReadWrite
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  OpenSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: wide open
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: "20"
      MasterUsername: admin
      MasterUserPassword: !Ref DbPassword
      PubliclyAccessible: true
      StorageEncrypted: false
      BackupRetentionPeriod: 0

  UnencryptedVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: us-east-1a
      Size: 20
      Encrypted: false

  AdminPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "*"
            Resource: "*"

  Trail:
    Type: AWS::CloudTrail::Trail
    Properties:
      IsLogging: true
      S3BucketName: !Ref PublicBucket
      IsMultiRegionTrail: false
      EnableLogFileValidation: false
